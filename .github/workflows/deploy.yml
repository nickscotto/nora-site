name: Deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"   # refresh the launch-spot count from Square
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html work CNAME .nojekyll robots.txt sitemap.xml _site/
      - name: Update launch-spot count
        env:
          SQUARE_TOKEN: ${{ secrets.SQUARE_TOKEN }}
        run: node scripts/update-count.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
